# Publishes ghcr.io/genesis-computing-ai/genesis-outpost:<version> (and :latest) for
# linux/amd64 and linux/arm64 from the binaries of a release in this repository, after
# checking them against the release's SHA256SUMS. No source code is involved.
name: Container image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release to package, without the v (e.g. 0.3.2)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/genesis-computing-ai/genesis-outpost
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then VERSION="${TAG#outpost-v}"; else VERSION="$INPUT"; fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version '$VERSION' is not semver"; exit 1
          fi
          tags="${IMAGE}:${VERSION}"
          if [[ "$VERSION" != *-* ]]; then tags="${tags},${IMAGE}:latest"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Download and verify the release files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "outpost-v${VERSION}" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'genesis-outpost-linux-*' --pattern SHA256SUMS --pattern THIRD_PARTY_NOTICES
          cd dist
          grep -E 'genesis-outpost-linux-(amd64|arm64)$' SHA256SUMS | sha256sum -c
          test -s THIRD_PARTY_NOTICES

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Genesis Outpost
            org.opencontainers.image.description=Lets Genesis reach systems inside your private network, outbound-only.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=LicenseRef-Genesis-Outpost
